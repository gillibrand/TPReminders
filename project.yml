name: TPReminders
options:
  bundleIdPrefix: com.dorothy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
targets:
  TPReminders:
    type: application
    platform: macOS
    sources:
      - path: TPReminders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dorothy.TPReminders
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TPReminders/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: TPReminders/TPReminders.entitlements
